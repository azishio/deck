<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The file system is the outline</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #discovery .scene {
        width: 100%;
        height: auto;
      }

      #discovery .path {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-mono);
        font-size: 18px;
        white-space: pre;
      }

      #discovery .num {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-mono);
        font-size: 18px;
        text-anchor: middle;
      }

      #discovery .id {
        fill: var(--deck-color-accent);
        font-family: var(--deck-font-mono);
        font-size: 18px;
      }

      #discovery .title {
        fill: var(--deck-color-text);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #discovery .caption {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #discovery .slot rect {
        fill: var(--deck-color-background);
        stroke: var(--deck-color-border);
        stroke-width: 1.5;
      }
    }
  </style>
</head>
<body>
  <deck-slide id="discovery">
    <deck-heading eyebrow="Discovery" sub="Adding a file adds a slide. There is no list in deck.toml to keep in step with it.">
      The file system is the outline
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 350" fill="none" role="img"
         aria-label="Slide files sorting themselves into deck order, then gaining ids and titles">
      <text class="caption" x="10" y="26">slides/</text>
      <text class="caption" x="700" y="26">deck order</text>

      <g id="files">
        <text class="path" x="10" y="76" data-slot="0">├── 00-title.html</text>
        <text class="path" x="10" y="126" data-slot="1">├── 10-background.html</text>
        <text class="path" x="10" y="176" data-slot="2">├── 20-architecture/</text>
        <text class="path" x="10" y="226" data-slot="3">│&#160;&#160; ├── 00-overview.html</text>
        <text class="path" x="10" y="276" data-slot="4">│&#160;&#160; └── 10-ingestion.html</text>
        <text class="path" x="10" y="326" data-slot="5">└── 90-summary.html</text>
      </g>

      <g id="slots">
        <g class="slot" data-slot="0">
          <rect x="610" y="46" width="530" height="40" rx="8"/>
          <text class="num" x="640" y="72">1</text>
          <text class="id" x="668" y="72" data-role="id">#title</text>
          <text class="title" x="800" y="72" data-role="title">deck</text>
        </g>
        <g class="slot" data-slot="1">
          <rect x="610" y="96" width="530" height="40" rx="8"/>
          <text class="num" x="640" y="122">2</text>
          <text class="id" x="668" y="122" data-role="id">#background</text>
          <text class="title" x="800" y="122" data-role="title">Why bother</text>
        </g>
        <g class="slot" data-slot="3">
          <rect x="610" y="146" width="530" height="40" rx="8"/>
          <text class="num" x="640" y="172">3</text>
          <text class="id" x="668" y="172" data-role="id">#overview</text>
          <text class="title" x="800" y="172" data-role="title">One pipeline</text>
        </g>
        <g class="slot" data-slot="4">
          <rect x="610" y="196" width="530" height="40" rx="8"/>
          <text class="num" x="640" y="222">4</text>
          <text class="id" x="668" y="222" data-role="id">#ingestion</text>
          <text class="title" x="800" y="222" data-role="title">Ingestion</text>
        </g>
        <g class="slot" data-slot="5">
          <rect x="610" y="246" width="530" height="40" rx="8"/>
          <text class="num" x="640" y="272">5</text>
          <text class="id" x="668" y="272" data-role="id">#summary</text>
          <text class="title" x="800" y="272" data-role="title">Takeaways</text>
        </g>
      </g>

      <text class="caption" x="610" y="322" id="note"></text>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      A directory contributes its children, not itself. Renumbering moves a slide
      without breaking a deep link, because the link is built from the id.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate, stagger, utils } from "/@deck/vendor/animejs.js";

    // The reveals here are animated rather than declared with data-step, so the
    // step count has to be stated.
    window.deck.setStepCount(3);

    const slots = [...document.querySelectorAll("#slots .slot")];
    const files = [...document.querySelectorAll("#files .path")];
    const ids = [...document.querySelectorAll('#slots [data-role="id"]')];
    const titles = [...document.querySelectorAll('#slots [data-role="title"]')];
    const scene = document.querySelector(".scene");

    /** Where a file's row sits relative to the slot it becomes. */
    function offsetFor(slot) {
      const file = files.find((entry) => entry.dataset.slot === slot.dataset.slot);
      if (!file) {
        return { x: 0, y: 0 };
      }
      const from = file.getBBox();
      const to = slot.getBBox();
      return { x: from.x - to.x, y: from.y + from.height / 2 - (to.y + to.height / 2) };
    }

    const NOTES = [
      "",
      "order — the path, sorted lexicographically",
      "identity — deck-slide[id], independent of the number",
      "title — the document's own <title>",
    ];

    const note = document.querySelector("#note");
    let arrived = false;

    /**
     * Draw the state for `step`.
     *
     * Called from the reveal as well as from `deck:stepchange`, because a deep
     * link applies its step before this module has a listener to hear it.
     */
    async function apply(step, { animated }) {
      note.textContent = NOTES[Math.min(step, NOTES.length - 1)];

      if (!animated) {
        utils.set(slots, { opacity: step >= 1 ? 1 : 0, translateX: 0, translateY: 0 });
        utils.set(ids, { opacity: step >= 2 ? 1 : 0 });
        utils.set(titles, { opacity: step >= 3 ? 1 : 0 });
        arrived = step >= 1;
        return;
      }

      if (step < 1) {
        utils.set(slots, { opacity: 0 });
        utils.set([...ids, ...titles], { opacity: 0 });
        arrived = false;
        return;
      }

      // The files fly across into deck order once, on the step that claims it.
      if (!arrived) {
        arrived = true;
        animate(slots, {
          opacity: [0, 1],
          translateX: (slot) => [offsetFor(slot).x, 0],
          translateY: (slot) => [offsetFor(slot).y, 0],
          duration: 620,
          delay: stagger(70),
          ease: "outQuad",
        });
      }

      animate(ids, { opacity: step >= 2 ? 1 : 0, duration: 260, delay: stagger(60) });
      animate(titles, { opacity: step >= 3 ? 1 : 0, duration: 260, delay: stagger(60) });
    }

    window.deck.onReveal(scene, async () => {
      arrived = false;
      await apply(window.deck.step, { animated: Boolean(await window.deck.animator()) });
    });

    document.addEventListener("deck:stepchange", async (event) => {
      await apply(event.detail.to, { animated: Boolean(await window.deck.animator()) });
    });
  </script>
</body>
</html>
