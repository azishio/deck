<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A design system you can override</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #design-system .scene {
        width: 100%;
        height: auto;
      }

      #design-system .slab {
        transform-box: fill-box;
        transform-origin: center;
      }

      #design-system .slab polygon {
        fill: var(--deck-color-surface);
        stroke: var(--deck-color-border);
        stroke-width: 1.5;
      }

      #design-system .slab.lit polygon {
        fill: var(--deck-color-accent-soft);
        stroke: var(--deck-color-accent);
      }

      #design-system .slab text {
        fill: var(--deck-color-text);
        font-family: var(--deck-font-mono);
        font-size: 18px;
      }

      #design-system .slab.lit text {
        fill: var(--deck-color-accent);
      }

      #design-system .verdict {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #design-system .drop {
        fill: var(--deck-color-accent);
      }
    }
  </style>
</head>
<body>
  <deck-slide id="design-system">
    <deck-heading eyebrow="Design system" sub="Web Components in Light DOM, Tailwind compiled inside every slide, and one fixed cascade.">
      Batteries included, none of them sealed
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 330" fill="none" role="img"
         aria-label="The seven cascade layers stacked, with a declaration landing on the one that wins">
      <g id="stack"></g>

      <circle class="drop" id="drop" cx="0" cy="0" r="9" opacity="0"/>

      <text class="verdict" id="verdict" x="120" y="310"></text>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      Your CSS outranks the design system and a Tailwind utility outranks yours —
      not by specificity tricks, but because the layer order is declared once by
      the runtime and never changes.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate, createTimeline, stagger, utils } from "/@deck/vendor/animejs.js";

    const SVG_NS = "http://www.w3.org/2000/svg";

    // Bottom of the cascade first, so the drawing stacks the way the spec reads.
    const LAYERS = [
      { name: "base", note: "Tailwind's reset" },
      { name: "theme", note: "Tailwind variables" },
      { name: "deck", note: "the design system" },
      { name: "project", note: "your design/ files" },
      { name: "slide", note: "this document's <style>" },
      { name: "components", note: "component overrides" },
      { name: "utilities", note: "Tailwind utilities" },
    ];

    const STEPS = [
      { lit: null, verdict: "" },
      { lit: "deck", verdict: "deck-card brings its own background — the design system's default." },
      { lit: "project", verdict: "design/theme.css declares one too, and sits higher. It wins." },
      { lit: "utilities", verdict: "A bg-surface utility outranks both. Utilities are last by design." },
    ];

    const stack = document.querySelector("#stack");
    const drop = document.querySelector("#drop");
    const verdict = document.querySelector("#verdict");

    const SKEW = 150;
    const WIDTH = 560;
    const HEIGHT = 30;
    const GAP = 8;
    const LEFT = 120;
    const TOP = 20;

    /** An isometric slab: the same rectangle, sheared and stacked. */
    function slabFor(index) {
      const y = TOP + (LAYERS.length - 1 - index) * (HEIGHT + GAP);
      const x = LEFT + index * 14;
      return {
        points: `${x},${y + HEIGHT} ${x + WIDTH},${y + HEIGHT} ${x + WIDTH + SKEW},${y} ${x + SKEW},${y}`,
        labelX: x + SKEW / 2 + 24,
        labelY: y + HEIGHT - 8,
        centreX: x + SKEW / 2 + WIDTH / 2,
        centreY: y + HEIGHT / 2,
      };
    }

    const slabs = LAYERS.map((layer, index) => {
      const geometry = slabFor(index);
      const group = document.createElementNS(SVG_NS, "g");
      group.setAttribute("class", "slab");
      group.dataset.layer = layer.name;

      const polygon = document.createElementNS(SVG_NS, "polygon");
      polygon.setAttribute("points", geometry.points);
      group.append(polygon);

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", String(geometry.labelX));
      label.setAttribute("y", String(geometry.labelY));
      label.textContent = layer.name;
      group.append(label);

      const note = document.createElementNS(SVG_NS, "text");
      note.setAttribute("x", String(geometry.labelX + 190));
      note.setAttribute("y", String(geometry.labelY));
      note.setAttribute("fill", "var(--deck-color-muted)");
      note.textContent = layer.note;
      group.append(note);

      stack.append(group);
      return { ...layer, group, geometry };
    });

    window.deck.setStepCount(STEPS.length - 1);

    function paint(step) {
      const target = STEPS[Math.min(step, STEPS.length - 1)];
      verdict.textContent = target.verdict;
      for (const slab of slabs) {
        slab.group.classList.toggle("lit", slab.name === target.lit);
      }
      return target;
    }

    async function apply(step, { animated }) {
      const target = paint(step);

      if (!animated) {
        utils.set(
          slabs.map((slab) => slab.group),
          { opacity: 1, translateX: 0 },
        );
        utils.set(drop, { opacity: target.lit ? 1 : 0 });
        if (target.lit) {
          const winner = slabs.find((slab) => slab.name === target.lit);
          utils.set(drop, { cx: winner.geometry.centreX, cy: winner.geometry.centreY });
        }
        return;
      }

      if (step === 0) {
        // The stack builds itself from the bottom up, which is the order the
        // layers are declared in.
        animate(
          slabs.map((slab) => slab.group),
          {
            opacity: [0, 1],
            translateX: [-40, 0],
            duration: 420,
            delay: stagger(70, { from: "last" }),
            ease: "outQuad",
          },
        );
        utils.set(drop, { opacity: 0 });
        return;
      }

      const winner = slabs.find((slab) => slab.name === target.lit);
      utils.set(slabs.map((slab) => slab.group), { opacity: 1, translateX: 0 });

      const arrival = createTimeline();
      arrival.add(drop, {
        cx: winner.geometry.centreX,
        cy: [winner.geometry.centreY - 90, winner.geometry.centreY],
        opacity: [0, 1],
        duration: 420,
        ease: "outQuad",
      });
      arrival.add(winner.group, { scale: [1, 1.02, 1], duration: 320 });
    }

    window.deck.onReveal(document.querySelector(".scene"), async () => {
      await apply(window.deck.step, { animated: Boolean(await window.deck.animator()) });
    });

    document.addEventListener("deck:stepchange", async (event) => {
      await apply(event.detail.to, { animated: Boolean(await window.deck.animator()) });
    });
  </script>
</body>
</html>
