name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.4"
  DECK_BROWSER: chrome
  # Ubuntu runners restrict unprivileged user namespaces, so Chromium's
  # sandbox cannot start. Everything it opens here is localhost.
  DECK_BROWSER_SANDBOX: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # deck only supports Chromium-based browsers; the checks and the
      # end-to-end tests drive one over CDP.
      - uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Lint the introduction deck
        run: cargo run --release -p deck-cli -- --root site --no-color check

      - name: Install mdBook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          cargo install mdbook-i18n-helpers --locked

      - name: Build the guide
        run: |
          mdbook build docs
          MDBOOK_BOOK__LANGUAGE=ja mdbook build docs --dest-dir book/ja
