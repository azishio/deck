<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steps are absolute</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #steps .scene {
        width: 100%;
        height: auto;
      }

      #steps .rail {
        stroke: var(--deck-color-border);
        stroke-width: 3;
      }

      #steps .travelled {
        stroke: var(--deck-color-accent);
        stroke-width: 3;
      }

      #steps .tick circle {
        fill: var(--deck-color-background);
        stroke: var(--deck-color-border);
        stroke-width: 2;
      }

      #steps .tick text {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-mono);
        font-size: 18px;
        text-anchor: middle;
      }

      #steps .head {
        fill: var(--deck-color-accent);
      }

      #steps .address {
        fill: var(--deck-color-accent);
        font-family: var(--deck-font-mono);
        font-size: 22px;
        text-anchor: middle;
      }

      #steps .panel rect {
        fill: var(--deck-color-accent-soft);
      }

      #steps .panel text {
        fill: var(--deck-color-accent);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #steps .formula {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-mono);
        font-size: 18px;
        text-anchor: middle;
      }
    }
  </style>
</head>
<body>
  <deck-slide id="steps">
    <deck-heading eyebrow="Steps &amp; animation" sub="Every arrow key you press moves the number below. Nothing else is remembered.">
      Screen state = f(slide, step)
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 330" fill="none" role="img"
         aria-label="A playhead moving along a step track as the slide advances">
      <path class="rail" d="M120 90 H 1030"/>
      <path class="travelled" id="travelled" d="M120 90 H 120"/>

      <g class="tick" data-at="120"><circle cx="120" cy="90" r="14"/><text x="120" y="140">0</text></g>
      <g class="tick" data-at="423"><circle cx="423" cy="90" r="14"/><text x="423" y="140">1</text></g>
      <g class="tick" data-at="727"><circle cx="727" cy="90" r="14"/><text x="727" y="140">2</text></g>
      <g class="tick" data-at="1030"><circle cx="1030" cy="90" r="14"/><text x="1030" y="140">3</text></g>

      <circle class="head" id="head" cx="120" cy="90" r="9"/>
      <text class="address" id="address" x="120" y="52">#/steps/0</text>

      <g class="panel">
        <g data-step="1">
          <rect x="120" y="190" width="290" height="70" rx="10"/>
          <text x="144" y="232">revealed at step 1</text>
        </g>
        <g data-step="2">
          <rect x="430" y="190" width="290" height="70" rx="10"/>
          <text x="454" y="232">revealed at step 2</text>
        </g>
        <g data-step="3">
          <rect x="740" y="190" width="290" height="70" rx="10"/>
          <text x="764" y="232">revealed at step 3</text>
        </g>
      </g>

      <text class="formula" x="575" y="305">a reload, a deep link and a second client all land on the same frame</text>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      Navigation sends an absolute step, never a relative "next". That is what lets
      the presenter view, the audience view and a hot swap agree without a handshake.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate } from "/@deck/vendor/animejs.js";

    const ticks = [...document.querySelectorAll(".tick")].map((tick) =>
      Number(tick.dataset.at),
    );
    const head = document.querySelector("#head");
    const travelled = document.querySelector("#travelled");
    const address = document.querySelector("#address");

    // The playhead follows the step model rather than the other way round: it is
    // reading the same number the presenter view and every audience client read.
    async function moveTo(step, { animated }) {
      const x = ticks[Math.min(Math.max(step, 0), ticks.length - 1)];
      address.textContent = `#/steps/${step}`;

      if (!animated) {
        head.setAttribute("cx", String(x));
        address.setAttribute("x", String(x));
        travelled.setAttribute("d", `M120 90 H ${x}`);
        return;
      }

      animate(head, { cx: x, duration: 360, ease: "outQuad" });
      animate(address, { x, duration: 360, ease: "outQuad" });

      // A plain object is a valid target, which is the tidiest way to drive a
      // path that has no animatable attribute of its own.
      const trail = { length: Number(travelled.getAttribute("d").split("H")[1]) };
      animate(trail, {
        length: x,
        duration: 360,
        ease: "outQuad",
        onUpdate: () => travelled.setAttribute("d", `M120 90 H ${trail.length}`),
      });
    }

    window.deck.onReveal(document.querySelector(".scene"), async () => {
      await moveTo(window.deck.step, { animated: false });
    });

    document.addEventListener("deck:stepchange", async (event) => {
      await moveTo(event.detail.to, {
        animated: Boolean(await window.deck.animator()) && !event.detail.instant,
      });
    });
  </script>
</body>
</html>
