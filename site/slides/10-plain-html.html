<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plain HTML in, slides out</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #plain-html .scene {
        width: 100%;
        height: auto;
      }

      /* Scaling an SVG element needs a box to scale about. */
      #plain-html .grows {
        transform-box: fill-box;
        transform-origin: center;
      }

      #plain-html .code {
        fill: var(--deck-color-code-text);
        font-family: var(--deck-font-mono);
        font-size: 18px;
        white-space: pre;
      }

      #plain-html .label {
        fill: var(--deck-color-text);
        font-family: var(--deck-font-sans);
        font-size: 18px;
        text-anchor: middle;
      }

      #plain-html .aside {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #plain-html .wire {
        stroke: var(--deck-color-accent);
        stroke-width: 2;
      }

      #plain-html .mark {
        fill: var(--deck-color-accent);
        opacity: 0.16;
      }
    }
  </style>
</head>
<body>
  <deck-slide id="plain-html">
    <deck-heading eyebrow="The input format" sub="No DSL, no Markdown requirement, no slide bodies buried in TOML.">
      What you write is what renders
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 360" fill="none" role="img"
         aria-label="Markup on the left becoming the rendered slide on the right, element by element">
      <rect x="8" y="16" width="524" height="328" rx="12" fill="var(--deck-color-code-background)"/>

      <text class="code" x="30" y="48">&lt;deck-slide id="architecture"&gt;</text>
      <text class="code" x="30" y="70">  &lt;deck-heading eyebrow="…"&gt;</text>
      <text class="code" x="30" y="92">    One pipeline, end to end</text>
      <text class="code" x="30" y="114">  &lt;/deck-heading&gt;</text>
      <text class="code" x="30" y="158">  &lt;deck-grid columns="2"&gt;</text>
      <text class="code" x="30" y="180">    &lt;deck-card&gt;Collection</text>
      <text class="code" x="30" y="202">    &lt;deck-card&gt;Visualisation</text>
      <text class="code" x="30" y="224">  &lt;/deck-grid&gt;</text>
      <text class="code" x="30" y="268">  &lt;deck-notes&gt;Speaker notes.</text>
      <text class="code" x="30" y="290">&lt;/deck-slide&gt;</text>

      <rect x="610" y="30" width="530" height="250" rx="12"
            fill="var(--deck-color-background)" stroke="var(--deck-color-border)" stroke-width="1.5"/>

      <g data-step="1">
        <rect class="mark" x="18" y="53" width="504" height="66" rx="6"/>
        <path class="wire" id="wire-heading" d="M532 86 C 574 86 592 74 640 74"/>
        <g class="grows" id="out-heading">
          <rect x="640" y="62" width="320" height="24" rx="5" fill="var(--deck-color-accent)"/>
          <rect x="640" y="96" width="230" height="12" rx="3" fill="var(--deck-color-border)"/>
        </g>
      </g>

      <g data-step="2">
        <rect class="mark" x="18" y="141" width="504" height="88" rx="6"/>
        <path class="wire" id="wire-grid" d="M532 185 H 640"/>
        <g class="grows" id="out-card-1">
          <rect x="640" y="132" width="230" height="110" rx="10"
                fill="var(--deck-color-surface)" stroke="var(--deck-color-border)"/>
          <text class="label" x="755" y="194">Collection</text>
        </g>
        <g class="grows" id="out-card-2">
          <rect x="880" y="132" width="230" height="110" rx="10"
                fill="var(--deck-color-surface)" stroke="var(--deck-color-border)"/>
          <text class="label" x="995" y="194">Visualisation</text>
        </g>
      </g>

      <g data-step="3">
        <rect class="mark" x="18" y="251" width="504" height="22" rx="6"/>
        <path class="wire" id="wire-notes" d="M532 262 C 566 262 578 322 610 322"/>
        <g id="out-notes">
          <rect x="610" y="306" width="330" height="32" rx="8"
                fill="none" stroke="var(--deck-color-border)" stroke-dasharray="6 5"/>
          <text class="aside" x="626" y="328">notes — never on the slide</text>
        </g>
      </g>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      Nothing here is generated at build time. The file you read is the document the
      browser gets, which is why an agent can edit it and you can review the diff.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate, createTimeline, stagger, svg } from "/@deck/vendor/animejs.js";

    const BEATS = [
      { wire: "#wire-heading", out: ["#out-heading"] },
      { wire: "#wire-grid", out: ["#out-card-1", "#out-card-2"] },
      { wire: "#wire-notes", out: ["#out-notes"] },
    ];

    // Each beat draws its connector, then lands the block it produced. Tied to
    // the reveal rather than to load, so it replays when you step back.
    for (const beat of BEATS) {
      const wire = document.querySelector(beat.wire);
      const blocks = beat.out.map((selector) => document.querySelector(selector));

      window.deck.onReveal(wire, async ({ signal }) => {
        if (!(await window.deck.animator())) {
          return;
        }
        const timeline = createTimeline();
        timeline.add(svg.createDrawable(wire), {
          draw: ["0 0", "0 1"],
          duration: 380,
          ease: "outQuad",
        });
        timeline.add(blocks, {
          opacity: [0, 1],
          scale: [0.94, 1],
          duration: 320,
          delay: stagger(90),
          ease: "outBack",
        });
        signal.addEventListener("abort", () => timeline.revert());
      });
    }
  </script>
</body>
</html>
