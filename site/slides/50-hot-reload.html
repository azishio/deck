<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot reload that keeps your place</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #hot-reload .scene {
        width: 100%;
        height: auto;
      }

      #hot-reload .node rect {
        fill: var(--deck-color-surface);
        stroke: var(--deck-color-border);
        stroke-width: 1.5;
      }

      #hot-reload .node text {
        fill: var(--deck-color-text);
        font-family: var(--deck-font-sans);
        font-size: 18px;
        text-anchor: middle;
      }

      #hot-reload .node .sub {
        fill: var(--deck-color-muted);
      }

      #hot-reload .node.lit rect {
        fill: var(--deck-color-accent-soft);
        stroke: var(--deck-color-accent);
      }

      #hot-reload .node.blocked rect {
        fill: #fdf1e0;
        stroke: var(--deck-color-warning);
      }

      #hot-reload .node.blocked text {
        fill: var(--deck-color-warning);
      }

      #hot-reload .route {
        stroke: var(--deck-color-border);
        stroke-width: 2;
        stroke-dasharray: 5 5;
      }

      #hot-reload .verdict {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-sans);
        font-size: 18px;
        text-anchor: middle;
      }
    }
  </style>
</head>
<body>
  <deck-slide id="hot-reload">
    <deck-heading eyebrow="Hot reload" sub="Edit on slide 14, stay on slide 14 — and save an unchanged file to nothing at all.">
      A save, followed end to end
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 300" fill="none" role="img"
         aria-label="A save travelling from the editor through the watcher and the hash gate to a replacement frame">
      <path class="route" id="route-full" d="M110 120 H 1010"/>
      <!-- Geometry only: the ride that ends at the gate. -->
      <path id="route-gate" d="M110 120 H 550"/>

      <g class="node" data-node="editor">
        <rect x="10" y="80" width="200" height="80" rx="10"/>
        <text x="110" y="114">editor</text>
        <text class="sub" x="110" y="140">a file is saved</text>
      </g>
      <g class="node" data-node="watcher">
        <rect x="230" y="80" width="200" height="80" rx="10"/>
        <text x="330" y="114">watcher</text>
        <text class="sub" x="330" y="140">inotify event</text>
      </g>
      <g class="node" data-node="gate">
        <rect x="450" y="80" width="200" height="80" rx="10"/>
        <text x="550" y="114">hash gate</text>
        <text class="sub" x="550" y="140">sha256 per file</text>
      </g>
      <g class="node" data-node="socket">
        <rect x="670" y="80" width="200" height="80" rx="10"/>
        <text x="770" y="114">websocket</text>
        <text class="sub" x="770" y="140">reload message</text>
      </g>
      <g class="node" data-node="frame">
        <rect x="890" y="80" width="240" height="80" rx="10"/>
        <text x="1010" y="114">replacement frame</text>
        <text class="sub" x="1010" y="140">crossfade on ready</text>
      </g>

      <circle id="token" cx="0" cy="0" r="10" fill="var(--deck-color-accent)" opacity="0"/>

      <text class="verdict" id="verdict" x="575" y="230"></text>
      <text class="verdict" id="detail" x="575" y="262"></text>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      A dev server that reads your project also touches access times, so an ungated
      watcher notifies itself in a loop. The slide id, step, presenter timer and
      blackout survive the swap; arbitrary JavaScript state does not.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate, svg, utils } from "/@deck/vendor/animejs.js";

    const nodes = [...document.querySelectorAll(".node")];
    const token = document.querySelector("#token");
    const verdict = document.querySelector("#verdict");
    const detail = document.querySelector("#detail");

    const STEPS = [
      { reach: -1, verdict: "", detail: "" },
      {
        reach: 4,
        route: "#route-full",
        duration: 1300,
        verdict: "the content changed — sha256 differs",
        detail: "only the frames using that file reload; a stylesheet edit swaps the link instead",
      },
      {
        reach: 2,
        blocked: true,
        route: "#route-gate",
        duration: 760,
        verdict: "saved again, byte for byte identical",
        detail: "dropped at the gate, which is what stops the server notifying itself",
      },
    ];

    window.deck.setStepCount(STEPS.length - 1);

    // Two routes rather than one interrupted ride: where the story stops is a
    // property of the drawing, not of a timer racing the animation.
    const ROUTES = {
      "#route-full": svg.createMotionPath("#route-full"),
      "#route-gate": svg.createMotionPath("#route-gate"),
    };

    function paint(step) {
      const target = STEPS[Math.min(step, STEPS.length - 1)];
      verdict.textContent = target.verdict;
      detail.textContent = target.detail;
      for (const [index, node] of nodes.entries()) {
        const reached = index <= target.reach;
        const stopped = Boolean(target.blocked) && index === target.reach;
        node.classList.toggle("lit", reached && !stopped);
        node.classList.toggle("blocked", stopped);
      }
      return target;
    }

    function apply(step, { animated }) {
      const target = paint(step);

      if (!animated || !target.route) {
        utils.set(token, { opacity: target.route ? 1 : 0 });
        return;
      }

      utils.set(token, { opacity: 1 });
      animate(token, {
        ...ROUTES[target.route],
        duration: target.duration,
        ease: "inOutQuad",
        onComplete: () => {
          if (target.blocked) {
            animate(token, { opacity: 0, duration: 300, delay: 260 });
          }
        },
      });
    }

    window.deck.onReveal(document.querySelector(".scene"), async () => {
      apply(window.deck.step, { animated: Boolean(await window.deck.animator()) });
    });

    document.addEventListener("deck:stepchange", async (event) => {
      apply(event.detail.to, { animated: Boolean(await window.deck.animator()) });
    });
  </script>
</body>
</html>
