<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation</title>
  <link rel="stylesheet" href="__DECK_BASE__@deck/shell.css">
  <script type="module" src="__DECK_BASE__@deck/present.js"></script>
</head>
<body class="deck-present">
  <div class="deck-frame-layer" data-deck-layer></div>

  <div class="deck-stage" data-deck-region="current"></div>

  <div class="deck-blackout" hidden></div>

  <div class="deck-hud">
    <span class="deck-hud__position" data-deck-position>–</span>
    <span class="deck-hud__title" data-deck-title></span>
    <span class="deck-hud__connection" data-deck-connection></span>
  </div>

  <div class="deck-progress"><span data-deck-progress></span></div>

  <div class="deck-toast" data-deck-toast hidden></div>

  <noscript>This presentation needs JavaScript.</noscript>
</body>
</html>
