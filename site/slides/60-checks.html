<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slides you can lint</title>

  <link rel="stylesheet" href="/@deck/design.css">
  <script type="module" src="/@deck/boot.js"></script>

  <style>
    @layer slide {
      #checks .scene {
        width: 100%;
        height: auto;
      }

      #checks .sample text {
        font-family: var(--deck-font-sans);
        text-anchor: middle;
      }

      #checks .meta {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-sans);
        font-size: 18px;
      }

      #checks .readout {
        fill: var(--deck-color-text);
        font-family: var(--deck-font-mono);
        font-size: 26px;
      }

      #checks .badge text {
        font-family: var(--deck-font-mono);
        font-size: 18px;
      }

      #checks .badge rect {
        fill: #fdecec;
      }

      #checks .badge text {
        fill: #b3261e;
      }

      #checks .badge.pass rect {
        fill: #e7f4e8;
      }

      #checks .badge.pass text {
        fill: #1b5e20;
      }

      #checks .cli {
        fill: var(--deck-color-muted);
        font-family: var(--deck-font-mono);
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <deck-slide id="checks">
    <deck-heading eyebrow="Checks" sub="headless Chromium with a pinned viewport, locale, timezone and device scale.">
      Slides you can lint
    </deck-heading>

    <svg class="scene" viewBox="0 0 1150 320" fill="none" role="img"
         aria-label="A sample of slide text being measured against the contrast and font-size rules">
      <rect id="surface" x="10" y="16" width="540" height="190" rx="12" fill="#eef2f7"/>
      <!-- The box exists to fail these rules on cue, so they must not be
           reported against this slide. -->
      <g class="sample" data-deck-check-ignore="low_contrast min_font_size">
        <text id="sample" x="280" y="118" font-size="20" fill="#8b93a7">Read from the back of the room</text>
      </g>
      <text class="meta" x="10" y="238">the rules measure the rendered pixels, not the stylesheet</text>

      <text class="meta" x="620" y="34">contrast against the computed background</text>
      <rect x="620" y="52" width="520" height="18" rx="9" fill="var(--deck-color-surface-strong)"/>
      <rect id="bar" x="620" y="52" width="0" height="18" rx="9" fill="#b3261e"/>
      <path d="M785 44 V 78" stroke="var(--deck-color-text)" stroke-width="2"/>
      <text class="meta" x="785" y="98" text-anchor="middle">4.5 — AA</text>

      <text class="readout" id="ratio" x="620" y="146">—</text>

      <g class="badge" id="badge-contrast">
        <rect x="620" y="170" width="300" height="38" rx="19"/>
        <text x="644" y="195">low_contrast</text>
      </g>
      <g class="badge" id="badge-size">
        <rect x="620" y="220" width="300" height="38" rx="19"/>
        <text x="644" y="245">min_font_size</text>
      </g>

      <text class="cli" id="cli" x="10" y="300"></text>
    </svg>

    <deck-footer divider>
      <span>deck — one slide is one complete HTML document</span>
      <deck-slide-number></deck-slide-number>
    </deck-footer>

    <deck-notes>
      Static rules need no browser: duplicate ids, missing files, unknown component
      names. Runtime rules catch console errors and readiness timeouts. Layout rules
      are these. Human, JSON or SARIF output; exit code 1 means violations.
    </deck-notes>
  </deck-slide>

  <script type="module">
    import { animate, utils } from "/@deck/vendor/animejs.js";

    const SCALE = { min: 1, max: 12, width: 520, left: 620 };

    const STATES = [
      { colour: "#8b93a7", size: 20, ratio: 2.72, cli: "$ deck check" },
      {
        colour: "#8b93a7",
        size: 20,
        ratio: 2.72,
        cli: "warning [low_contrast] contrast 2.72 < 4.5",
      },
      {
        colour: "#3f4a60",
        size: 20,
        ratio: 7.91,
        cli: "1 slide checked: 0 errors, 0 warnings",
      },
      {
        colour: "#3f4a60",
        size: 15,
        ratio: 7.91,
        cli: "warning [min_font_size] font size is too small: 15px < 18px",
      },
    ];

    window.deck.setStepCount(STATES.length - 1);

    const sample = document.querySelector("#sample");
    const bar = document.querySelector("#bar");
    const ratioText = document.querySelector("#ratio");
    const cli = document.querySelector("#cli");
    const badges = {
      contrast: document.querySelector("#badge-contrast"),
      size: document.querySelector("#badge-size"),
    };

    const widthFor = (ratio) =>
      Math.max(0, Math.min(1, (ratio - SCALE.min) / (SCALE.max - SCALE.min))) * SCALE.width;

    function label(step) {
      const state = STATES[Math.min(step, STATES.length - 1)];
      const contrastPasses = state.ratio >= 4.5;
      const sizePasses = state.size >= 18;

      badges.contrast.classList.toggle("pass", contrastPasses);
      badges.size.classList.toggle("pass", sizePasses);
      badges.contrast.querySelector("text").textContent =
        `low_contrast  ${state.ratio.toFixed(2)} / 4.5`;
      badges.size.querySelector("text").textContent = `min_font_size  ${state.size} / 18`;
      cli.textContent = state.cli;
      return state;
    }

    function apply(step, { animated }) {
      const state = label(step);
      const width = widthFor(state.ratio);
      const colour = state.ratio >= 4.5 ? "#1b5e20" : "#b3261e";

      if (!animated) {
        utils.set(sample, { fill: state.colour, fontSize: state.size });
        utils.set(bar, { width, fill: colour });
        ratioText.textContent = `${state.ratio.toFixed(2)} : 1`;
        return;
      }

      animate(sample, { fill: state.colour, fontSize: state.size, duration: 520, ease: "outQuad" });
      animate(bar, { width, fill: colour, duration: 620, ease: "outQuad" });

      // The number is tweened by animating a plain object and writing the label
      // on each frame — the same trick deck-stat's countup uses.
      const counter = { value: Number.parseFloat(ratioText.textContent) || SCALE.min };
      animate(counter, {
        value: state.ratio,
        duration: 620,
        ease: "outQuad",
        onUpdate: () => {
          ratioText.textContent = `${counter.value.toFixed(2)} : 1`;
        },
      });
    }

    window.deck.onReveal(document.querySelector(".scene"), async () => {
      apply(window.deck.step, { animated: false });
    });

    document.addEventListener("deck:stepchange", async (event) => {
      apply(event.detail.to, {
        animated: Boolean(await window.deck.animator()) && !event.detail.instant,
      });
    });
  </script>
</body>
</html>
