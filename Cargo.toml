[workspace]
resolver = "3"
members = ["crates/deck-cli", "crates/deck-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azishio/deck"

[workspace.dependencies]
deck-core = { path = "crates/deck-core", version = "0.1.0" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
camino = { version = "1.2.5", features = ["serde1"] }
chromiumoxide = "0.9.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
futures = "0.3.33"
hex = "0.4.3"
mime_guess = "2.0.5"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
open = "5.4.0"
percent-encoding = "2.3.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
